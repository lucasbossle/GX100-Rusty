[package]
name = "opengx100-gui"
version = "0.3.0"
description = "Graphical editor for the BOSS GX-100"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "opengx100-editor"
path = "src/main.rs"

[dependencies]
opengx100-protocol = { path = "../opengx100-protocol" }
opengx100-extract = { path = "../opengx100-extract" }
opengx100-midi = { path = "../opengx100-midi" }
eframe = "0.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dirs = "7.0.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rfd = "0.17.2"

[dev-dependencies]
tempfile = "3.27.0"
