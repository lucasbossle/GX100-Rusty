[package]
name = "gx100-cli"
version = "0.1.0"
description = "Command-line tool for the BOSS GX-100"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "gx100"
path = "src/main.rs"

[features]
default = ["midi"]
# Real MIDI I/O via gx100-midi (midir). Without it only offline commands and --sim work.
midi = ["dep:gx100-midi"]

[dependencies]
gx100-protocol = { path = "../gx100-protocol" }
gx100-extract = { path = "../gx100-extract" }
gx100-midi = { path = "../gx100-midi", optional = true }
